stages:
  - train
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  MODEL_VERSION: "${CI_PIPELINE_ID}"
  IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_ID}"

retrain-model:
  stage: train
  image: python:3.11-slim
  before_script:
    - pip install -r model/requirements.txt
  script:
    - echo "Starting model retraining..."
    - python model/train.py
    - |
      if [ -f models/model.pkl ]; then
        echo "Model trained successfully"
        echo "MODEL_VERSION=${MODEL_VERSION}" > model_info.env
      else
        echo "Error: Model file not found"
        exit 1
      fi
  artifacts:
    paths:
      - models/
      - model_info.env
    expire_in: 1 week
  only:
    - manual
    - webhook
  tags:
    - docker

build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - |
      if [ -d models ]; then
        cp -r models app/
      fi
    - docker build -t $IMAGE_TAG -t ${CI_REGISTRY_IMAGE}:latest -f app/Dockerfile .
    - docker push $IMAGE_TAG
    - docker push ${CI_REGISTRY_IMAGE}:latest
    - echo "Image pushed: $IMAGE_TAG"
  dependencies:
    - retrain-model
  only:
    - manual
    - webhook
  tags:
    - docker

update-helm-chart:
  stage: deploy
  image: alpine/helm:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@example.com"
    - git config --global user.name "GitLab CI"
  script:
    - echo "Updating Helm chart with new image version..."
    - |
      sed -i "s|tag:.*|tag: \"${CI_PIPELINE_ID}\"|g" helm/values.yaml
      sed -i "s|repository:.*|repository: ${CI_REGISTRY_IMAGE}|g" helm/values.yaml
    - |
      git add helm/values.yaml
      git commit -m "Update model version to ${CI_PIPELINE_ID}" || echo "No changes to commit"
      git push https://oauth2:${CI_GIT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:${CI_COMMIT_REF_NAME} || echo "Push failed or no changes"
    - echo "Helm chart updated. ArgoCD will sync automatically."
  dependencies:
    - build-image
  only:
    - manual
    - webhook
  when: manual
  tags:
    - docker

deploy-helm:
  stage: deploy
  image: alpine/helm:latest
  before_script:
    - apk add --no-cache kubectl
    - |
      echo "$KUBECONFIG" | base64 -d > kubeconfig
      export KUBECONFIG=$(pwd)/kubeconfig
  script:
    - echo "Deploying with Helm..."
    - |
      sed -i "s|tag:.*|tag: \"${CI_PIPELINE_ID}\"|g" helm/values.yaml
      sed -i "s|repository:.*|repository: ${CI_REGISTRY_IMAGE}|g" helm/values.yaml
    - helm upgrade --install aiops-quality ./helm --namespace default --create-namespace
    - echo "Deployment completed"
  dependencies:
    - build-image
  only:
    - manual
  when: manual
  tags:
    - docker

